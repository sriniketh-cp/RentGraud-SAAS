<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RentGuard Login Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50:  "#eff6ff",
              100: "#dbeafe",
              500: "#3b82f6",
              600: "#2563eb",
              700: "#1d4ed8",
            }
          },
          keyframes: {
            "fade-in": {
              "0%":   { opacity: "0", transform: "translateY(8px)" },
              "100%": { opacity: "1", transform: "translateY(0)" }
            }
          },
          animation: {
            "fade-in": "fade-in 0.25s ease-out both"
          }
        }
      }
    };
  </script>
  <script type="module" src="script.js"></script>

</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center px-4 py-10">

 
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg overflow-hidden animate-fade-in">

 
    <div class="bg-brand-600 px-8 py-7">
      <h1 class="text-white text-2xl font-semibold tracking-tight">Welcome</h1>
      <p class="text-brand-100 text-sm mt-1">Sign in to continue to your dashboard</p>
    </div>

    
    <div class="flex border-b border-slate-200">
      <button
        id="tab-login"
        onclick="switchTab('login')"
        class="tab-btn flex-1 py-3.5 text-sm font-semibold text-brand-600 border-b-2 border-brand-600 bg-white transition-colors duration-150"
        aria-selected="true"
      >
        Log In
      </button>
      <button
        id="tab-signup"
        onclick="switchTab('signup')"
        class="tab-btn flex-1 py-3.5 text-sm font-semibold text-slate-400 border-b-2 border-transparent bg-white hover:text-slate-700 transition-colors duration-150"
        aria-selected="false"
      >
        Sign Up
      </button>
    </div>

    
    <div class="px-8 py-7">

     
      <div
        id="alert-box"
        class="hidden mb-5 px-4 py-3 rounded-lg text-sm font-medium"
        role="alert"
      ></div>

    
      <div id="content-login" class="tab-content block animate-fade-in">
        <form onsubmit="handleLogin(event)" novalidate>

          
          <div class="mb-4">
            <label for="login-email" class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">
              Email
            </label>
            <input
              id="login-email"
              type="email"
              placeholder="you@example.com"
              required
              autocomplete="email"
              class="focus:outline-none focus:border-brand-500 focus:ring-[3px] focus:ring-brand-500/15 w-full px-4 py-2.5 rounded-lg border border-slate-300 text-slate-800 text-sm transition-shadow duration-150"
            />
          </div>

          <div class="mb-6">
            <label for="login-password" class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">
              Password
            </label>
            <div class="relative">
              <input
                id="login-password"
                type="password"
                placeholder="••••••••"
                required
                autocomplete="current-password"
                class="focus:outline-none focus:border-brand-500 focus:ring-[3px] focus:ring-brand-500/15 w-full px-4 py-2.5 rounded-lg border border-slate-300 text-slate-800 text-sm transition-shadow duration-150 pr-10"
              />
              <button type="button" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 toggle-password" data-target="login-password" title="Toggle password visibility">
                👁️
              </button>
            </div>
          </div>

          <button
            id="btn-login"
            type="submit"
            class="w-full py-2.5 rounded-lg bg-brand-600 hover:bg-brand-700 active:bg-brand-700 text-white text-sm font-semibold transition-colors duration-150 flex items-center justify-center gap-2"
          >
            <span id="btn-login-text">Log In</span>
            <svg id="btn-login-spinner" class="hidden animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
          </button>
        </form>

        <div class="flex items-center gap-3 my-5">
          <hr class="flex-1 border-slate-200" />
          <span class="text-xs text-slate-400 font-medium">or</span>
          <hr class="flex-1 border-slate-200" />
        </div>

        <button
          id="btn-google-login"
          onclick="handleGoogleSignIn()"
          class="w-full py-2.5 rounded-lg border border-slate-300 hover:bg-slate-50 active:bg-slate-100 text-slate-700 text-sm font-semibold transition-colors duration-150 flex items-center justify-center gap-2.5"
        >
          <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>
      </div>

      <div id="content-signup" class="tab-content hidden">
        <form onsubmit="handleSignUp(event)" novalidate>

          <div class="mb-4">
            <label for="signup-email" class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">
              Email
            </label>
            <input
              id="signup-email"
              type="email"
              placeholder="you@example.com"
              required
              autocomplete="email"
              class="focus:outline-none focus:border-brand-500 focus:ring-[3px] focus:ring-brand-500/15 w-full px-4 py-2.5 rounded-lg border border-slate-300 text-slate-800 text-sm transition-shadow duration-150"
            />
          </div>

          <div class="mb-6">
            <label for="signup-password" class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">
              Password
              <span class="normal-case font-normal text-slate-400 ml-1">(min. 6 characters)</span>
            </label>
            <div class="relative">
              <input
                id="signup-password"
                type="password"
                placeholder="srini123"
                required
                minlength="6"
                autocomplete="new-password"
                class="focus:outline-none focus:border-brand-500 focus:ring-[3px] focus:ring-brand-500/15 w-full px-4 py-2.5 rounded-lg border border-slate-300 text-slate-800 text-sm transition-shadow duration-150 pr-10"
              />
              <button type="button" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 toggle-password" data-target="signup-password" title="Toggle password visibility">
                👁️
              </button>
            </div>
          </div>

          <button
            id="btn-signup"
            type="submit"
            class="w-full py-2.5 rounded-lg bg-brand-600 hover:bg-brand-700 active:bg-brand-700 text-white text-sm font-semibold transition-colors duration-150 flex items-center justify-center gap-2"
          >
            <span id="btn-signup-text">Create Account</span>
            <svg id="btn-signup-spinner" class="hidden animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
          </button>
        </form>

        <div class="flex items-center gap-3 my-5">
          <hr class="flex-1 border-slate-200" />
          <span class="text-xs text-slate-400 font-medium">or</span>
          <hr class="flex-1 border-slate-200" />
        </div>

        <button
          id="btn-google-signup"
          onclick="handleGoogleSignIn()"
          class="w-full py-2.5 rounded-lg border border-slate-300 hover:bg-slate-50 active:bg-slate-100 text-slate-700 text-sm font-semibold transition-colors duration-150 flex items-center justify-center gap-2.5"
        >
          <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>
      </div>

    </div>
  </div>
</body>
</html>
